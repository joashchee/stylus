[package]
name = "stylus-core"
version = "0.2.0"
description = "Stylus's engine: ANSI art formats, SAUCE, rendering, converters, generators and the theme-pack tools, on icy_tools"
authors = ["ansiapps"]
edition = "2021"
license = "MIT"
publish = false

# Tauri-free, so the desktop app and the web build (WebAssembly) share it,
# and MIT, so the closed-source ansiapps apps can use it too (Diskette's
# docs/stylus-notes.md, "Why MIT"). No GPL/AGPL/LGPL dependencies.
[dependencies]
# icy_tools (MIT OR Apache-2.0, used under MIT). Not on crates.io, and an
# app suite's internals without semver promises, so pinned to one git
# revision and upgraded deliberately. Keep ICY_TOOLS_REV in src/lib.rs in
# step with this.
icy_engine = { git = "https://github.com/mkrueger/icy_tools", rev = "b85e565d5ca258f01fd0dd16e5ae1ee6a354e452" }
# SAUCE records (Apache-2.0). Same git spec as icy_tools' workspace, so it's
# the same crate icy_engine returns; Cargo.lock pins the commit.
icy_sauce = { git = "https://github.com/mkrueger/icy_sauce" }
serde = { version = "1", features = ["derive"] }

# Only for the examples (scripts/compare-ansilove.sh): PNG in and out
# (MIT OR Apache-2.0).
[dev-dependencies]
png = "0.18"
