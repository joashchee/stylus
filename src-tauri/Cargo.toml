[package]
name = "stylus"
version = "0.3.0"
description = "Stylus — ANSI art and animation, and the ANSIapps theme's workshop"
authors = ["ansiapps"]
edition = "2021"
license = "MIT"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows
# issue, see https://github.com/rust-lang/cargo/issues/8519).
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# MIT, and no GPL/AGPL/LGPL dependencies, so stylus-core stays usable by
# the closed-source ansiapps apps (CLAUDE.md rule 2). Check licenses
# whenever Cargo.lock or package-lock.json changes.
[dependencies]
stylus-core = { path = "../stylus-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Apple Pencil's double-tap and squeeze (src/pencil.rs). Already in the tree
# through Tauri; MIT.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIInteraction", "UIPencilInteraction", "UIResponder", "UIView"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
